[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "poptrap"
dynamic = ["version"]
description = "Local, consent-first browser simulations with a terminal creator app."
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "poptrap/web/scripts/vendor/jsQR.LICENSE.txt"]
requires-python = ">=3.11"
authors = [
    { name = "POPTRAP Contributors" },
]
keywords = ["terminal", "tui", "textual", "cli", "poptrap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Typing :: Typed",
]
dependencies = [
    "textual>=8.2.8,<9.0.0",
    "rich>=14.2.0,<15.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "tomli-w>=1.0.0,<2.0.0",
    "fastapi>=0.164.0,<1.0.0",
    # Recheck the explicit legacy WebSocket backend and transport limits before widening.
    "uvicorn>=0.54.0,<0.55.0",
    "websockets>=15.0,<17.0",
    "ifaddr>=0.2,<1.0",
    "segno>=1.6,<2.0",
    "idna>=3.15,<4.0.0",
    "markdown-it-py>=2.2.0,<5.0.0",
    "pygments>=2.20.0,<3.0.0",
    "opentelemetry-api>=1.45.2,<2.0.0",
    "anyio>=4.14.2,<5.0.0",
    "h11>=0.16.0,<1.0.0",
    "starlette>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.5.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "certifi>=2026.10.18",
]

[project.urls]
Repository = "https://github.com/cybervault-Hacky/PopTrap"
Issues = "https://github.com/cybervault-Hacky/PopTrap/issues"
Security = "https://github.com/cybervault-Hacky/PopTrap/security/policy"

[project.scripts]
poptrap = "poptrap.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "poptrap._version.__version__"}

[tool.setuptools.packages.find]
include = ["poptrap", "poptrap.*"]
namespaces = false

[tool.setuptools.package-data]
poptrap = [
    "py.typed",
    "data/*.toml",
    "ui/*.tcss",
    "ui/styles/*.tcss",
    "web/*.html",
    "web/styles/*.css",
    "web/scripts/*.js",
    "web/scripts/effects/*.js",
    "web/scripts/vendor/*.js",
    "web/scripts/vendor/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
