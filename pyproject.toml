[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "poptrap"
version = "0.1.0"
description = "Cross-platform, terminal-first prank experience platform."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "POPTRAP Contributors" },
]
keywords = ["terminal", "tui", "textual", "cli", "poptrap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "textual>=0.85.0,<9.0.0",
    "rich>=13.7.0,<15.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "tomli-w>=1.0.0,<2.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "websockets>=13.0,<17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.scripts]
poptrap = "poptrap.cli:main"

[tool.setuptools.packages.find]
include = ["poptrap*"]

[tool.setuptools.package-data]
poptrap = [
    "py.typed",
    "ui/*.tcss",
    "ui/styles/*.tcss",
    "web/*.html",
    "web/styles/*.css",
    "web/scripts/*.js",
    "web/scripts/effects/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
