name: Verify POPTRAP

on: [push, pull_request]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      # Quoted: "--only-binary=:all: -r" contains ": ", which is illegal inside an
      # unquoted YAML plain scalar and made GitHub reject this workflow before any
      # job was created (every earlier run failed in 0s with no log).
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements/test.lock -r requirements/build.lock'
      - run: python -m pip check
      - name: Verify lock hashes and per-platform wheel availability
        run: |
          set -o pipefail
          python tools/verify_install.py --stages structure,hashes,platforms 2>&1 | tee "$RUNNER_TEMP/verify-locks.txt"
      # The LAN containment test binds a real socket to a real host address, so its
      # outcome depends on how this runner routes to that address. Record the facts as
      # a notice annotation, which is readable from the API without fetching job logs.
      - name: Record runner networking facts for the LAN boundary test
        run: |
          set -o pipefail
          python - <<'PY' | tee "$RUNNER_TEMP/lan-diagnostic.txt"
          import socket
          import subprocess
          from ipaddress import IPv4Address

          import httpx

          from poptrap.engine.delivery.security import list_lan_interfaces
          from poptrap.engine.delivery.server import DeliveryServer

          interfaces = list_lan_interfaces()
          for item in interfaces:
              address = str(item.address.ip)
              route = subprocess.run(
                  ["ip", "route", "get", address], capture_output=True, text=True, check=False,
              ).stdout.strip().replace("\n", " ")
              with socket.socket() as listener:
                  listener.bind((address, 0))
                  listener.listen(1)
                  with socket.create_connection(listener.getsockname(), timeout=2) as probe:
                      selected = probe.getsockname()[0]
                      accepted, _ = listener.accept()
                      observed = accepted.getpeername()[0]
                      accepted.close()
              inside = IPv4Address(observed) in item.address.network
              print(f"{item.label} | route: {route} | src: {selected} | peer: {observed} | in-subnet: {inside}")

          if interfaces:
              delivery = DeliveryServer()
              endpoint = delivery.start(interfaces[0], lan_confirmed=True)
              try:
                  with httpx.Client(trust_env=False, timeout=3) as http:
                      response = http.get(endpoint.origin + "/availability")
                  print(
                      f"delivery {endpoint.origin} | host-header: {response.request.headers.get('host')!r} "
                      f"| authority: {endpoint.authority!r} | status: {response.status_code} "
                      f"| body: {response.text[:110]!r}"
                  )
              finally:
                  delivery.stop()
          PY
          python - <<'PY'
          import os
          from pathlib import Path

          text = (Path(os.environ["RUNNER_TEMP"]) / "lan-diagnostic.txt").read_text()
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::notice title=LAN boundary facts::{text[:900]}")
          PY
      - name: Regression tests
        run: |
          set -o pipefail
          python -m pytest -q -rf --tb=short 2>&1 | tee "$RUNNER_TEMP/pytest.txt"
      - name: Web component tests
        run: |
          set -o pipefail
          node --test tests/web/*.mjs 2>&1 | tee "$RUNNER_TEMP/node.txt"
      - name: Build and verify locally
        run: |
          python tools/build_release.py --epoch 1794960000 --output "$RUNNER_TEMP/poptrap-build"
          (cd "$RUNNER_TEMP/poptrap-build" && sha256sum -c SHA256SUMS)
      - name: Smoke-test the installed wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/poptrap-installed"
          cd "$RUNNER_TEMP"
          poptrap-installed/bin/python -m pip install --require-hashes --only-binary=:all: -r poptrap-build/runtime.lock
          poptrap-installed/bin/python -m pip install --no-deps poptrap-build/*.whl
          poptrap-installed/bin/python -m pip check
          poptrap-installed/bin/python -I "$GITHUB_WORKSPACE/tools/check_install.py"
      - name: Verify the documented fresh-install flow end to end
        run: |
          set -o pipefail
          python tools/verify_install.py --stages fresh --workdir "$RUNNER_TEMP/poptrap-verify" 2>&1 | tee "$RUNNER_TEMP/verify-fresh.txt"
      # Job logs are awkward to reach from the API, so a failing run also reports
      # the relevant tail of each captured log as a check annotation.
      - name: Surface failures as annotations
        if: failure()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])

          def emit(title: str, body: str) -> None:
              body = "\n".join(body.splitlines()[-140:]) or "no captured output"
              body = body.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title={title}::{body}")

          captured = {
              "pytest.txt": "pytest failures",
              "verify-locks.txt": "lock and platform verification failures",
              "verify-fresh.txt": "fresh-install verification failures",
              "node.txt": "web component test failures",
          }
          for name, title in captured.items():
              path = temp / name
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              if name == "pytest.txt" and "= FAILURES =" in text:
                  emit(title, text[text.index("= FAILURES ="):])
              elif "[FAIL]" in text or "# fail" in text:
                  emit(title, "\n".join(
                      line for line in text.splitlines()
                      if "[FAIL]" in line or line.startswith("# fail") or "verification:" in line
                  ))
          PY
